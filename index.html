<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>冬木 | 视觉设计作品集</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',system-ui,sans-serif;}
html,body{width:100%;overflow-x:hidden;}
body{background:#fff;color:#1c1c1c;}

/* 布局 */
.layout-wrap{display:flex;width:100%;min-height:100vh;}

/* 桌面侧边栏 */
.sidebar{
  width:260px;
  position:fixed;
  top:0;left:0;
  height:100vh;
  display:flex;
  flex-direction:column;
  justify-content:center;
  padding:0 30px;
  background:transparent;
}
.logo-area{margin-bottom:30px;}
.logo-area img{width:180px;height:auto;object-fit:contain;}
.sidebar-item{
  font-size:15px;
  color:#666;
  padding:10px 0;
  cursor:pointer;
  white-space:nowrap;
  transition:0.2s;
}
.sidebar-item.active{color:#EB7F46;font-weight:500;}
.sidebar-item:hover{color:#2A6CF3;transform:translateX(4px);}
.about-link{
  margin-top:30px;
  font-size:14px;
  color:#333;
  text-decoration:none;
  padding:10px 0;
}

/* 主内容 */
.main-content{
  width:calc(100% - 260px);
  margin-left:260px;
  padding:50px 20px;
}
.grid-wrap{
  column-count:2;
  column-gap:10px;
  opacity:0;
  transition:opacity 0.4s;
}
.grid-wrap.visible{opacity:1;}
.grid-item{
  position:relative;
  overflow:hidden;
  margin-bottom:10px;
  break-inside:avoid;
  max-height:650px;
  cursor:pointer;
  box-shadow:0 6px 20px rgba(0,0,0,0.05);
}
.grid-item img{
  width:100%;
  height:auto;
  display:block;
}
.grid-item::after{
  content:attr(data-title);
  position:absolute;
  bottom:0;left:0;right:0;
  width:100%;
  text-align:center;
  padding:12px 0;
  font-size:15px;
  color:#fff;
  background:linear-gradient(transparent,rgba(0,0,0,0.6));
  opacity:0;
  transition:0.3s;
  white-space:nowrap;
  pointer-events:none;
}
.grid-item:hover::after{opacity:1;}

/* 全屏预览 */
.fullscreen-overlay{
  position:fixed;top:0;left:0;
  width:100%;height:100vh;
  background:#000;z-index:9999;
  opacity:0;visibility:hidden;
  transition:0.3s;overflow:auto;
}
.fullscreen-overlay.show{opacity:1;visibility:visible;}
.full-img-container{
  width:100%;height:100vh;
  display:flex;align-items:center;justify-content:center;
}
.fullscreen-img{
  max-height:100vh;
  max-width:100%;
  object-fit:contain;
  cursor:grab;
}

.click-prev,.click-close,.click-next{
  position:fixed;top:0;height:100vh;z-index:10;
}
.click-prev{left:0;width:33.333%;}
.click-close{left:33.333%;width:33.333%;}
.click-next{right:0;width:33.333%;}

/* ===================== 移动端 / iPad 适配 ===================== */
@media(max-width:1024px){
  .sidebar{
    position:relative;
    width:100%;
    height:auto;
    padding:20px;
    align-items:center;
    text-align:center;
  }
  .layout-wrap{flex-direction:column;}
  .main-content{
    width:100%;
    margin-left:0;
    padding:20px 15px;
  }
  .grid-wrap{column-count:1;}
  .grid-item{max-height:500px;}
  .logo-area img{width:150px;}
  .sidebar-item{padding:8px 0;}
}
</style>
</head>

<body>
<div class="layout-wrap">
  <div class="sidebar" id="sidebarBox">
    <div class="logo-area"><img src="logo.png" alt="冬木 DESIGN" onclick="location.href='index.html'"></div>
    <a href="about.html" class="about-link">关于我</a>
  </div>

  <div class="main-content">
    <div class="grid-wrap" id="gridBox"></div>
  </div>
</div>

<div class="fullscreen-overlay" id="overlay">
  <div class="full-img-container"><img class="fullscreen-img" id="fullImg"></div>
  <div class="click-prev" id="prevBtn"></div>
  <div class="click-close" id="closeBtn"></div>
  <div class="click-next" id="nextBtn"></div>
</div>

<script src="works.js"></script>
<script>
const categories = [
  { name: "品牌大事件与空间体验", value: "brandEvent" },
  { name: "零售终端与渠道物料", value: "retailMaterial" },
  { name: "新媒体与私域视觉运营", value: "newMedia" },
  { name: "品牌物料与内部文化", value: "brandCulture" },
  { name: "插画设计", value: "illustration" }
];

const sidebarBox = document.getElementById("sidebarBox");
const gridBox = document.getElementById("gridBox");
const overlay = document.getElementById("overlay");
const fullImg = document.getElementById("fullImg");
const prevBtn = document.getElementById("prevBtn");
const nextBtn = document.getElementById("nextBtn");
const closeBtn = document.getElementById("closeBtn");

let currentWorks = [];
let currentIndex = 0;
let currentCateVal = "";
let scale = 1;

categories.forEach((item, index) => {
  let div = document.createElement("div");
  div.className = "sidebar-item" + (index === 0 ? " active" : "");
  div.innerText = item.name;
  div.onclick = () => switchCategory(item.value, div);
  sidebarBox.insertBefore(div, document.querySelector(".about-link"));
});

function switchCategory(cateVal, el) {
  document.querySelectorAll(".sidebar-item").forEach(i => i.classList.remove("active"));
  el.classList.add("active");
  currentCateVal = cateVal;
  
  gridBox.classList.remove("visible");
  setTimeout(() => {
    gridBox.innerHTML = "";
    currentWorks = allWorks.filter(v => v.cate === cateVal);
    
    currentWorks.forEach((work, idx) => {
      let div = document.createElement("div");
      div.className = "grid-item";
      div.dataset.title = work.title;
      let img = document.createElement("img");
      img.src = work.cover;
      div.appendChild(img);

      if(cateVal === "brandEvent"){
        div.onclick = () => { localStorage.setItem("nowWorkId", work.id); location.href = "detail.html"; };
      } else {
        div.onclick = () => { currentIndex = idx; openFull(); };
      }
      gridBox.appendChild(div);
    });
    gridBox.classList.add("visible");
  }, 150);
}

function openFull(){
  scale = 1;
  fullImg.src = currentWorks[currentIndex].cover;
  fullImg.style.transform = `scale(${scale})`;
  overlay.classList.add("show");
  document.body.style.overflow = "hidden";
  overlay.scrollTop = 0;
}

closeBtn.onclick = () => {
  overlay.classList.remove("show");
  document.body.style.overflow = "auto";
};

prevBtn.onclick = () => {
  currentIndex = (currentIndex - 1 + currentWorks.length) % currentWorks.length;
  fullImg.src = currentWorks[currentIndex].cover;
  scale = 1;
  fullImg.style.transform = "scale(1)";
};

nextBtn.onclick = () => {
  currentIndex = (currentIndex + 1) % currentWorks.length;
  fullImg.src = currentWorks[currentIndex].cover;
  scale = 1;
  fullImg.style.transform = "scale(1)";
};

overlay.addEventListener("wheel", (e) => {
  e.preventDefault();
  scale += e.deltaY > 0 ? -0.1 : 0.1;
  if(scale < 0.2) scale = 0.2;
  fullImg.style.transform = `scale(${scale})`;
});

overlay.addEventListener("mousedown", (e) => {
  const startY = e.clientY;
  const scrollTop = overlay.scrollTop;
  const onMove = (e) => { overlay.scrollTop = scrollTop - (e.clientY - startY); };
  const onUp = () => { window.removeEventListener("mousemove", onMove); window.removeEventListener("mouseup", onUp); };
  window.addEventListener("mousemove", onMove);
  window.addEventListener("mouseup", onUp);
});

switchCategory(categories[0].value, document.querySelector(".sidebar-item"));
</script>
</body>
</html>

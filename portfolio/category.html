<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>作品列表 | 冬木</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',system-ui,sans-serif;}
body{background:#fff;color:#1c1c1c;padding-top:80px;}
nav{position:fixed;top:0;left:0;width:100%;padding:26px 5%;display:flex;justify-content:space-between;align-items:center;background:#fff;z-index:999;border-bottom:1px solid #f5f5f5;}
.logo{font-size:16px;font-weight:500;}
.back-btn{padding:6px 16px;border:1px solid #1c1c1c;background:#fff;color:#1c1c1c;font-size:13px;cursor:pointer;border-radius:2px;transition:0.2s;}
.back-btn:hover{background:#1c1c1c;color:#fff;}
.grid-wrap{padding:60px 5% 120px;max-width:1400px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:40px;}
.grid-item{cursor:pointer;transition:all 0.3s ease;overflow:hidden;}
.grid-item:hover{transform:scale(0.97);}
.grid-item img{width:100%;height:300px;object-fit:cover;border-radius:4px;display:block;}
.grid-item h4{display:none;}
@media(max-width:768px){
    .grid-wrap{grid-template-columns:1fr;gap:30px;padding-top:40px;}
    .grid-item img{height:220px;}
}
</style>
</head>
<body>
<nav>
    <div class="logo">冬木 DESIGN</div>
    <span class="back-btn" onclick="history.back()">返回首页</span>
</nav>

<div class="grid-wrap" id="gridBox"></div>

<script src="works.js"></script>
<script>
let nowCate=localStorage.getItem("nowCate");
let filterWorks=allWorks.filter(v=>v.cate===nowCate);
const gridBox=document.getElementById("gridBox");
filterWorks.forEach(work=>{
    let div=document.createElement("div");
    div.className="grid-item";
    div.onclick=()=>{localStorage.setItem("nowWorkId",work.id);location.href="detail.html";};
    div.innerHTML=`<img src="${work.cover}" alt="">`;
    gridBox.appendChild(div);
})
</script>
</body>
</html>

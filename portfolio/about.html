<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>关于我 | 冬木</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',system-ui,sans-serif;}
body{
  background: #fff;
  color: #1c1c1c;
  padding-top: 80px;
  line-height: 1.8;
  overflow-x: hidden;
}

/* 导航栏（保持全站统一） */
nav{
  position: fixed;
  top:0; left:0;
  width:100%;
  padding: 26px 3%;
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: rgba(255,255,255,0.85);
  backdrop-filter: blur(20px);
  z-index: 999;
  border-bottom: 1px solid rgba(0,0,0,0.06);
}
.logo{
  font-size:16px;
  font-weight:500;
  letter-spacing:1px;
  cursor: pointer;
}
.nav-a a{
  margin-left:30px;
  text-decoration:none;
  color:#1c1c1c;
  font-size:14px;
  opacity:0.85;
  transition: all 0.3s ease;
}
.nav-a a:hover{
  opacity:1;
  transform: translateY(-1px);
}

/* 参考图核心布局：左图(5/12) + 右文(7/12) */
.about-container{
  display:flex;
  gap:60px;
  max-width:1200px;
  margin:0 auto;
  padding:80px 5% 140px;
  align-items: flex-start;
}

/* 左侧个人照片区域 */
.about-img{
  width:41.67%; /* 5/12 */
}
.about-img img{
  width:100%;
  height:auto;
  display:block;
  object-fit: contain;
}

/* 右侧文字区域 */
.about-text{
  width:58.33%; /* 7/12 */
}
.about-text h1{
  font-size:40px;
  font-weight:500;
  line-height:1.2;
  margin-bottom:30px;
}
.about-text p{
  font-size:15px;
  line-height:1.8;
  color:#333;
  margin-bottom:20px;
}
.about-text .info-section{
  margin-top:40px;
  font-size:13px;
  color:#555;
  border-top:1px solid #eee;
  padding-top:20px;
}
.about-text .info-section p{
  margin:5px 0;
}
.about-text .social-link{
  display:flex;
  align-items:center;
  gap:10px;
  margin-top:15px;
  font-size:13px;
  color:#333;
  text-decoration:none;
}
.about-text .social-link:hover{
  color:#000;
}

/* 移动端适配 */
@media(max-width:900px){
  .about-container{
    flex-direction:column;
    gap:40px;
    padding:60px 5% 100px;
  }
  .about-img, .about-text{
    width:100%;
  }
  .about-text h1{
    font-size:30px;
  }
}
</style>
</head>
<body>
<nav>
    <div class="logo" onclick="location.href='index.html'">冬木 DESIGN</div>
    <div class="nav-a">
        <a href="index.html">首页</a>
        <a href="about.html">关于我</a>
    </div>
</nav>

<div class="about-container">

    <div class="about-img">

    <!-- 右侧文字内容 -->
    <div class="about-text">
        <h1>冬木</h1>
        <p>品牌视觉设计师，6年餐饮与零售行业设计经验。</p>
        <p>擅长品牌视觉落地与活动全案执行，从展会空间到零售终端、从新媒体运营到周边产品开发均有完整项目经验。</p>
        <p>能独立对接需求、梳理Brief、把控从创意到落地的全流程，适配线上线下多渠道视觉输出。</p>
        <p>熟练使用 ai智能工具出图， PS / AI等设计软件，可独立完成从前期策划、视觉定稿到落地输出全流程工作。</p>

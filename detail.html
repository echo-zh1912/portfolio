<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>项目详情 | 冬木</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',system-ui,sans-serif;}
body{background:#fff;color:#1c1c1c;padding-top:80px;line-height:1.8;}

nav{
  position:fixed;top:0;left:0;width:100%;
  padding:26px 5%;display:flex;justify-content:space-between;align-items:center;
  background:rgba(255,255,255,0.85);backdrop-filter:blur(20px);
  z-index:999;border-bottom:1px solid rgba(0,0,0,0.06);
}
.logo{font-size:16px;font-weight:500;cursor: pointer;}
.back-btn{padding:6px 16px;border:1px solid #1c1c1c;background:#fff;color:#1c1c1c;font-size:13px;cursor:pointer;border-radius:2px;transition:0.2s;}
.back-btn:hover{background:#1c1c1c;color:#fff;}

/* 左5/7 右2/7 布局 */
.detail-container{display:flex;gap:40px;max-width:1400px;margin:0 auto;padding:60px 5% 140px;}
.img-area{width:71.4%;}
.text-area{width:28.6%;padding-top:10px;}

.img-list{display:grid;gap:20px;}
.img-list img{
  width:100%;
  height:auto;
  display:block;
  object-fit:unset;
  cursor: pointer;
  transition: all 0.25s ease;
}
.img-list img:hover{
  opacity: 0.92;
  transform: scale(1.01);
}

/* 文字规范：标题30px 正文15px 严格3倍 */
.detail-title{font-size:30px;font-weight:500;margin-bottom:20px;line-height:1.2;}
.detail-cate{font-size:12px;color:#777;margin-bottom:30px;padding-bottom:20px;border-bottom:1px solid #eee;}
.desc-text{font-size:15px;line-height:1.8;color:#333;}

/* 全屏预览层 */
.fullscreen-overlay{
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.92);
  z-index: 9999;
  opacity: 0;
  visibility: hidden;
  transition: all 0.35s ease;
}
.fullscreen-overlay.show{
  opacity: 1;
  visibility: visible;
}
.full-main{
  width:100%;
  height:100%;
  display:flex;
  justify-content:center;
  align-items:center;
  position:relative;
}
.fullscreen-img{
  max-width: 90%;
  max-height: 90vh;
  object-fit: contain;
  transform: scale(0.92);
  transition: transform 0.35s ease;
}
.fullscreen-overlay.show .fullscreen-img{
  transform: scale(1);
}
/* 左右点击区域 */
.click-left{
  position:absolute;
  left:0;
  top:0;
  width:35%;
  height:100%;
  cursor:w-resize;
}
.click-right{
  position:absolute;
  right:0;
  top:0;
  width:35%;
  height:100%;
  cursor:e-resize;
}
.click-center{
  position:absolute;
  left:35%;
  top:0;
  width:30%;
  height:100%;
  cursor:zoom-out;
}

@media(max-width:900px){
  .detail-container{flex-direction:column;gap:30px;}
  .img-area, .text-area{width:100%;}
  .detail-title{font-size:24px;}
  .desc-text{font-size:14px;}
}
</style>
</head>
<body>
<nav>
    <div class="logo" onclick="location.href='index.html'">冬木 DESIGN</div>
    <div class="nav-a">
        <span class="back-btn" onclick="history.back()">返回列表</span>
    </div>
</nav>

<div class="detail-container">
    <div class="img-area">
        <div class="img-list" id="dImgBox"></div>
    </div>
    <div class="text-area">
        <h2 class="detail-title" id="dTitle"></h2>
        <div class="detail-cate" id="dCate"></div>
        <div class="desc-text" id="dDesc"></div>
    </div>
</div>

<!-- 全屏预览结构 -->
<div class="fullscreen-overlay" id="overlay">
    <div class="full-main">
        <div class="click-left" id="prevArea"></div>
        <img class="fullscreen-img" id="fullImg" src="" alt="">
        <div class="click-right" id="nextArea"></div>
        <div class="click-center" id="closeArea"></div>
    </div>
</div>

<script src="works.js"></script>
<script>
let wid=Number(localStorage.getItem("nowWorkId"));
let work=allWorks.find(v=>v.id===wid);
if(!work)location.href="index.html";

let cateList = [
    { name: "品牌大事件与空间体验", value: "brandEvent" },
    { name: "零售终端与渠道物料", value: "retailMaterial" },
    { name: "新媒体与私域视觉运营", value: "newMedia" },
    { name: "品牌物料与内部文化", value: "brandCulture" },
    { name: "插画设计", value: "illustration" }
];
let cName=cateList.find(v=>v.value===work.cate).name;

document.getElementById("dTitle").innerText=work.title;
document.getElementById("dCate").innerText="项目分类："+cName;
document.getElementById("dDesc").innerText=work.desc;

const imgBox=document.getElementById("dImgBox");
const overlay = document.getElementById("overlay");
const fullImg = document.getElementById("fullImg");
const prevArea = document.getElementById("prevArea");
const nextArea = document.getElementById("nextArea");
const closeArea = document.getElementById("closeArea");

const imgArr = work.imgs;
let nowIndex = 0;

// 渲染页面图片
imgArr.forEach((src,idx)=>{
    let img=document.createElement("img");
    img.src=src;
    imgBox.appendChild(img);
    img.addEventListener('click',()=>{
        nowIndex = idx;
        fullImg.src = imgArr[nowIndex];
        overlay.classList.add('show');
        document.body.style.overflow = 'hidden';
    })
})

// 关闭全屏
closeArea.addEventListener('click',()=>{
    overlay.classList.remove('show');
    document.body.style.overflow = 'auto';
})

// 上一张
function showPrev(){
    nowIndex--;
    if(nowIndex < 0) nowIndex = imgArr.length - 1;
    fullImg.src = imgArr[nowIndex];
}
// 下一张
function showNext(){
    nowIndex++;
    if(nowIndex >= imgArr.length) nowIndex = 0;
    fullImg.src = imgArr[nowIndex];
}

prevArea.addEventListener('click',showPrev);
nextArea.addEventListener('click',showNext);

// 鼠标滚轮翻图
overlay.addEventListener('wheel',(e)=>{
    if(e.deltaY > 0){
        // 下滑 下一张
        showNext();
    }else{
        // 上滑 上一张
        showPrev();
    }
})
</script>
</body>
</html>
